repos:
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.22.0 
    hooks:
    - id: zizmor
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
    - id: mypy
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format