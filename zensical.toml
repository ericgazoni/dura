[project]
site_url = "https://ericgazoni.github.io/dura/"
site_name = "dura"
site_description = "An embeddable SQLite-backed durable execution engine and worker pool for Python"
site_author = "Eric Gazoni"

repo_url = "https://github.com/ericgazoni/dura"
repo_name = "ericgazoni/dura"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Tutorial" = "tutorial.md" },
  { "How-to guides" = [
    { "Configure retries" = "how-to/configure-retries.md" },
    { "Checkpoint steps" = "how-to/checkpoint-steps.md" },
    { "Wait for events" = "how-to/wait-for-events.md" },
    { "Use durable state" = "how-to/use-durable-state.md" },
    { "Prioritize tasks" = "how-to/prioritize-tasks.md" },
    { "Enqueue idempotently" = "how-to/idempotent-enqueue.md" },
    { "Chain and fan out tasks" = "how-to/compose-tasks.md" },
    { "Schedule recurring tasks" = "how-to/schedule-recurring-tasks.md" },
    { "Run a worker pool" = "how-to/run-worker-pool.md" },
    { "Expose health and metrics" = "how-to/expose-health-and-metrics.md" },
    { "Clean up old tasks" = "how-to/clean-up-old-tasks.md" },
  ]},
  { "Explanation" = [
    { "Durability model" = "explanation/durability-model.md" },
    { "Scope and alternatives" = "explanation/scope-and-alternatives.md" },
  ]},
  { "API Reference" = [
    { "dura.engine" = "reference/engine.md" },
    { "dura.workers" = "reference/workers.md" },
    { "dura.health" = "reference/health.md" },
  ]},
]

[project.plugins.mkdocstrings.config.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.config.handlers.python.options]
docstring_style = "sphinx"
show_source = true
show_root_heading = true
show_root_full_path = false
merge_init_into_class = true
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
members_order = "source"
docstring_section_style = "table"


# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ericgazoni/dura"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
