[project]
name = "dura"
version = "0.1.0"
description = "A SQLite-backed durable execution engine and worker pool"
authors = [{ name = "Eric Gazoni", email = "eric@adimian.com" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/ericgazoni/dura"
Documentation = "https://ericgazoni.github.io/dura/"
Issues = "https://github.com/ericgazoni/dura/issues"

[dependency-groups]
dev = [
    "mkdocstrings>=1.0.6",
    "mkdocstrings-python>=2.0.7",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "zensical>=0.0.56",
]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"
