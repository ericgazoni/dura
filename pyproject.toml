[project]
name = "dura"
version = "0.1.0"
description = "A SQLite-backed durable execution engine and worker pool"
authors = [{ name = "Eric Gazoni", email = "eric@adimian.com" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "mkdocstrings>=1.0.6",
    "mkdocstrings-python>=2.0.7",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "zensical>=0.0.56",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
